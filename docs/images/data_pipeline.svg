<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">서울시 물재생센터 유입수질 예측 데이터 파이프라인</title>
  <desc id="desc">서울시 수질과 ASOS 기온은 수질·기온 정제로, 서울시 강우는 일별 강우 집계로 연결되고, 계통별 결합과 30일 입력 생성, 데이터 품질 검증, 시간순 분할, 모델 비교와 최종 평가로 이어지는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .source { fill: #e8f1ff; stroke: #3b82f6; }
      .process { fill: #f8fafc; stroke: #64748b; }
      .audit { fill: #ecfdf5; stroke: #10b981; }
      .model { fill: #fff7ed; stroke: #f97316; }
      .final { fill: #f5f3ff; stroke: #8b5cf6; }
      .label { font-size: 18px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
      .sub { font-size: 14px; font-weight: 450; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-head { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        text { fill: #f1f5f9; }
        .source { fill: #172554; stroke: #60a5fa; }
        .process { fill: #1e293b; stroke: #94a3b8; }
        .audit { fill: #052e2b; stroke: #34d399; }
        .model { fill: #431407; stroke: #fb923c; }
        .final { fill: #2e1065; stroke: #a78bfa; }
        .sub { fill: #cbd5e1; }
        .arrow { stroke: #94a3b8; }
        .arrow-head { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text x="600" y="40" class="title" text-anchor="middle">유입수질 예측 데이터 파이프라인</text>

  <rect x="90" y="75" width="280" height="82" class="box source"/>
  <text x="230" y="108" class="label">서울시 수질</text>
  <text x="230" y="137" class="sub">BOD · T-N · T-P · SS</text>

  <rect x="460" y="75" width="280" height="82" class="box source"/>
  <text x="600" y="108" class="label">ASOS 기온</text>
  <text x="600" y="137" class="sub">일평균 기온</text>

  <rect x="830" y="75" width="280" height="82" class="box source"/>
  <text x="970" y="108" class="label">서울시 강우</text>
  <text x="970" y="137" class="sub">10분 관측자료</text>

  <line x1="230" y1="157" x2="230" y2="215" class="arrow"/>
  <line x1="600" y1="157" x2="600" y2="215" class="arrow"/>
  <line x1="970" y1="157" x2="970" y2="215" class="arrow"/>

  <rect x="120" y="215" width="530" height="82" class="box process"/>
  <text x="385" y="248" class="label">수질·기온 정제</text>
  <text x="385" y="277" class="sub">유입수 필터링 · 날짜 정렬</text>

  <rect x="750" y="215" width="330" height="82" class="box process"/>
  <text x="915" y="248" class="label">일별 강우 집계</text>
  <text x="915" y="277" class="sub">결측·중복·완전성 검증</text>

  <path d="M385 297 V325 H500 V350" class="arrow"/>
  <path d="M915 297 V325 H700 V350" class="arrow"/>

  <rect x="330" y="350" width="540" height="82" class="box process"/>
  <text x="600" y="383" class="label">센터·처리장·관측 계통별 결합</text>
  <text x="600" y="412" class="sub">계통 간 혼합 방지 · 원본 식별자 보존</text>

  <line x1="600" y1="432" x2="600" y2="475" class="arrow"/>

  <rect x="330" y="475" width="540" height="82" class="box process"/>
  <text x="600" y="508" class="label">과거 30일 입력 데이터 생성</text>
  <text x="600" y="537" class="sub">다음 날 BOD · T-N · T-P 목표</text>

  <line x1="600" y1="557" x2="600" y2="600" class="arrow"/>

  <rect x="330" y="600" width="540" height="82" class="box audit"/>
  <text x="600" y="633" class="label">데이터 품질 검증</text>
  <text x="600" y="662" class="sub">원본 무결성 · 독립 재계산 · 누수 검증</text>

  <path d="M600 682 V706 H250 V730" class="arrow"/>

  <rect x="100" y="730" width="300" height="82" class="box process"/>
  <text x="250" y="763" class="label">시간순 분할</text>
  <text x="250" y="792" class="sub">Train · Validation · Test</text>

  <line x1="400" y1="771" x2="450" y2="771" class="arrow"/>

  <rect x="450" y="730" width="300" height="82" class="box model"/>
  <text x="600" y="763" class="label">모델 학습·비교</text>
  <text x="600" y="792" class="sub">LightGBM · XGBoost · LSTM</text>

  <line x1="750" y1="771" x2="800" y2="771" class="arrow"/>

  <rect x="800" y="730" width="300" height="82" class="box final"/>
  <text x="950" y="763" class="label">최종 XGBoost</text>
  <text x="950" y="792" class="sub">성능 평가 · 오차 분석</text>
</svg>
